<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samurai Dice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div id="game-container">
        
        <header>
            <h1>Samurai Dice</h1>
        </header>

        <main>
            <section id="player1" class="player-section active">
                <h2>Player 1</h2>
                <figure class="character-box p1-90deg-trapezoid">
                    <img src="images/player1-cat.png" alt="Player 1 Samurai Cat" width="240" height="300">
                    <span class="roll-result-badge">3</span>
                </figure>
                <p class="score-display p1-score">Score: <span id="score1">0</span></p>
            </section>

            <section id="game-controls">
                <figure class="dice-area">
                    <img src="images/dice-1.png" alt="Dice 1" width="100" height="100" id="dice1">
                    <img src="images/dice-2.png" alt="Dice 2" width="100" height="100" id="dice2">
                </figure>

                <nav class="action-buttons">
                    <button type="button" id="btn-roll">ROLL</button>
                    <button type="button" id="btn-pass">PASS</button>
                </nav>
            </section>

            <section id="player2" class="player-section">
                <h2>Player 2</h2>
                <p class="score-display p2-score">Score: <span id="score2">0</span></p>
                <figure class="character-box p2-90deg-trapezoid">
                    <img src="images/player2-cat.png" alt="Player 2 Samurai Cat" width="240" height="300">
                    <span class="roll-result-badge">3</span>
                </figure>
            </section>
        </main>

        <footer>
            <p id="turn-indicator">Player 1 Turn</p>
        </footer>

    </div>

</body>
</html>

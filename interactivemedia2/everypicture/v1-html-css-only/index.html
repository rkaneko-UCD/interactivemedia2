<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Picture</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main id="viewport">
        <div id="background-track">
            
            <section class="station" id="station1">
                <div class="canvas-wrapper">
                    <img src="images/canvaspic.png" alt="Canvas 1" width="300" height="400" id="canvas1" class="interactive-canvas">
                </div>
            </section>

            <section class="station" id="station2">
                <div class="canvas-wrapper">
                    <img src="images/canvaspich.png" alt="Canvas 2" width="300" height="400" id="canvas2" class="interactive-canvas">
                </div>
            </section>

            <section class="station" id="station3">
                <div class="canvas-wrapper">
                    <img src="images/canvaspich.png" alt="Canvas 3" width="300" height="400" id="canvas3" class="interactive-canvas">
                </div>
            </section>

        </div>

        <div id="character" class="idle">
            <img src="images/humanpic1.png" alt="Artist" width="150" height="250" id="hero-img">
        </div>

        <aside id="art-overlay" class="hidden">
            <div class="display-container">
                <button id="close-btn" aria-label="Close details">X</button>
                <div class="display-content">
                    <div class="image-area">
                        <img src="images/drawing1.jpeg" alt="Artwork Detail" id="display-img">
                    </div>
                    <div class="description-area">
                        <h2 id="art-title">Artwork Title</h2>
                        <p id="art-desc">Detailed explanation of the artwork will appear here.</p>
                    </div>
                </div>
            </div>
        </aside>
    </main>

</body>
</html>
